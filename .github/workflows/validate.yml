name: Validate research archive
on: [push, pull_request]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_archive.py
      - run: python scripts/render_results.py
      - run: git diff --exit-code -- docs/results-overview.svg
